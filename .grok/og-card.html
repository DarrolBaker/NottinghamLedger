<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Libre Baskerville";
    src: url("fonts/LibreBaskerville.ttf") format("truetype");
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Libre Baskerville";
    src: url("fonts/LibreBaskerville-Italic.ttf") format("truetype");
    font-weight: 400 700;
    font-style: italic;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F3EFE6;
  }
  body {
    font-family: "Libre Baskerville", "Liberation Serif", serif;
    color: #1A2330;
  }
  .sheet {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #F3EFE6;
    overflow: hidden;
  }
  /* Ledger lines — faint, like a costed briefing, not a spreadsheet. */
  .sheet::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      rgba(26, 35, 48, 0.055) 31px,
      rgba(26, 35, 48, 0.055) 32px
    );
    pointer-events: none;
  }
  /* Cotton fiber, kept light so type stays ink-sharp. */
  .sheet::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.14  0 0 0 0 0.19  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .plate {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(14, 124, 116, 0.55);
    pointer-events: none;
  }
  .plate-inner {
    position: absolute;
    inset: 33px;
    border: 1px solid rgba(26, 35, 48, 0.14);
    pointer-events: none;
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 10px;
    background: #0E7C74;
  }
  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 96px 48px;
  }
  .kicker {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #0E7C74;
    margin-bottom: 18px;
  }
  .rules {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 420px;
    margin-bottom: 28px;
  }
  .rule-thick {
    width: 100%;
    height: 3px;
    background: #0E7C74;
  }
  .rule-thin {
    width: 100%;
    height: 1px;
    background: #0E7C74;
  }
  .badge {
    position: relative;
    width: 108px;
    height: 108px;
    border: 1.5px solid #1A2330;
    display: grid;
    place-items: center;
    background: #F3EFE6;
    margin-bottom: 22px;
  }
  .badge span {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    transform: translateY(-2px);
  }
  .rust {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #A33B24;
    right: -6px;
    bottom: -6px;
  }
  h1 {
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 0.95;
    color: #1A2330;
  }
  .tag {
    margin-top: 18px;
    font-size: 26px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.005em;
    color: #1A2330;
  }
  .foot {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #1A2330;
  }
  .foot i {
    display: block;
    width: 36px;
    height: 1px;
    background: #0E7C74;
    font-style: normal;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="band"></div>
    <div class="plate"></div>
    <div class="plate-inner"></div>
    <div class="stack">
      <p class="kicker">Nottingham · Nottinghamshire</p>
      <div class="rules" aria-hidden="true">
        <div class="rule-thick"></div>
        <div class="rule-thin"></div>
      </div>
      <div class="badge" aria-hidden="true"><span>NL</span><i class="rust"></i></div>
      <h1>Notts Ledger</h1>
      <p class="tag">Buses, trams, rates, and a lawful ask.</p>
      <div class="foot"><i></i>Civic briefing<i></i></div>
    </div>
  </div>
</body>
</html>
